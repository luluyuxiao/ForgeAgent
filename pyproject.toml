[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "forgeagent-local"
version = "0.2.0"
description = "A small, policy-driven coding-agent runtime"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "luluyuxiao" }]
keywords = ["agent", "coding", "llm", "tool-calling", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "openai>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9"]

[project.scripts]
forgeagent = "forgeagent.cli:main"
forgeagent-eval = "forgeagent.eval:main"
forgeagent-trace = "forgeagent.trace_viewer:main"

[tool.hatch.build.targets.wheel]
packages = ["src/forgeagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
